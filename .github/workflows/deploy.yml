name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 允许 GitHub Pages 部署所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署在运行
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine basePath
        id: basepath
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            # 用户主页仓库：部署到根路径，无需 basePath
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "→ 用户主页仓库，basePath 为空"
          else
            # 项目仓库：部署到 /repo-name 子路径
            echo "base_path=/$REPO" >> "$GITHUB_OUTPUT"
            echo "→ 项目仓库，basePath = /$REPO"
          fi

      - name: Build
        env:
          NEXT_BASE_PATH: ${{ steps.basepath.outputs.base_path }}
        run: npm run build

      - name: Add .nojekyll
        run: touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
